  notes: [
    { id: "g1", from: 154, to: 155, title: "Juliet remembers the plan", meaning: "Juliet wakes clear-headed. She remembers where she should be and asks for Romeo.",
      effect: "The audience has waited for this moment, and it comes with painful hope. She trusts the plan, so she is calm. Her question “Where is my Romeo?” is the one we cannot bear to answer.",
      ask: "How does Juliet’s calm make the next moment more painful?", tags: ["love", "irony"], revise: true, support: "Her calm tone is ironic because…" },
    { id: "g2", at: 158, phrase: "A greater power than we can contradict", title: "The Friar names a greater power", meaning: "The Friar says a power greater than humans has ruined their plans.",
      effect: "He explains the disaster as fate, or as God’s will. Some readers see honest humility. Others see a man who steps away from responsibility at the moment he needs to stay. The text does not settle it, so use a quotation to support whichever view you argue.",
      ask: "Is the Friar explaining what happened, or avoiding blame?", tags: ["fate", "family", "language"], revise: true, support: "The phrase “a greater power” suggests that the Friar…", stretch: "Compare this with “Unhappy fortune!” in 5.2. Does his view change?" },
    { id: "g3", at: 164, phrase: "I dare no longer stay", title: "The Friar leaves her", meaning: "The Friar runs away because he is afraid of being caught.",
      effect: "Juliet is left alone with two bodies. The adult who helped her now abandons her. This is a point where authority figures fail the young lovers, a pattern throughout the play.",
      ask: "What does it suggest about the adults in the play that the Friar leaves?", tags: ["family", "ahead"], support: "The Friar’s departure shows that adults…" },
    { id: "g4", at: 165, phrase: "I will not away", title: "Juliet chooses to stay", meaning: "The Friar begs her to leave and Juliet refuses.",
      effect: "Juliet’s refusal is definite. Earlier she said “myself have power to die”, and here she uses that power. It shows loyalty, will and courage. A reader could also see despair, so a careful answer might weigh both.",
      ask: "Which is stronger in this line: choice or despair?", tags: ["love", "fate"], revise: true, support: "Juliet’s refusal, “I will not away”, shows that she…", stretch: "Compare with Juliet’s “myself have power to die” at the end of 3.5." },
    { id: "g5", at: 168, phrase: "left no friendly drop", title: "A bitter joke", meaning: "Juliet scolds Romeo for drinking all the poison and leaving none for her.",
      effect: "The playful complaint (“O churl”) is the sort of affectionate joking lovers use. Poison is called “friendly”, as if it were a gift. The odd tone reminds us she is still a girl as well as a tragic heroine.",
      ask: "What does it suggest about Juliet that she can joke in this moment?", tags: ["love", "language"] },
    { id: "g6", at: 172, phrase: "Thy lips are warm!", title: "Minutes too late", meaning: "Juliet finds that Romeo’s lips are still warm, which shows he died only moments ago.",
      effect: "Everything depends on timing, and this line shows how narrowly it was missed. The short exclamation is a gasp of discovery. It reveals the cruelty of the arrangement without anyone stating it.",
      ask: "Why is a short, simple sentence so effective here?", tags: ["irony", "fate"], revise: true, support: "The short sentence suggests that…", stretch: "How does this line connect with the Friar’s “Unhappy fortune!”?" },
    { id: "g7", at: 174, phrase: "O, happy dagger", title: "“Happy” dagger", meaning: "“Happy” here means lucky or fortunate. Juliet calls the dagger fortunate because it will let her die.",
      effect: "It is an oxymoron: a weapon is “happy”. She also treats the dagger like a sheath for love, saying her body is its sheath. Rusting there suggests a kind of rest. The wording makes death sound welcome, as Romeo’s “cordial” did.",
      ask: "How is “happy dagger” similar to Romeo’s “cordial and not poison”?", tags: ["language", "love", "irony"], revise: true, support: "“Happy dagger” is an oxymoron because…", stretch: "Compare Juliet’s way of dying with Romeo’s." },
    { id: "g8", stage: "jdie", phrase: "stabs herself", title: "A silent death", meaning: "Juliet dies on stage with Romeo’s dagger.",
      effect: "Romeo had a long speech before dying, but Juliet’s death is quick. Some readers see agency, a young woman taking control. Others see another victim of the feud. Both readings can be supported from the text, and an exam answer should state which one it follows.",
      ask: "Is Juliet’s death an act of agency, victimhood, or both? Use one quotation.", tags: ["love", "fate", "family"] }
  ] },
{ type: "extract", key: "e8", short: "5.3 Blame", mins: 12, label: "Extract 8", scene: "5.3",

    { k: "ln", n: 185, t: "We see the ground whereon these woes do lie,", g: "We see the ground where these sorrows lie," },

  notes: [
    { id: "h1", from: 185, to: 187, title: "The “ground” of the woes", meaning: "The Watch notice the ground where the bodies lie, but cannot yet see the true cause (“the true ground”).",
      effect: "The repeated word “ground” plays on two meanings: the earth where the bodies are and the reason behind the deaths. It signals that the play has become an investigation, with every character knowing only a piece.",
      ask: "What are the two meanings of “ground” in these lines?", tags: ["language", "context"], revise: true, support: "The word “ground” has two meanings…" },
    { id: "h2", at: 211, phrase: "This dagger hath mista’en", title: "A “mistaken” dagger", meaning: "Capulet says the dagger has made a mistake: it should be in Romeo’s sheath, but it is in Juliet.",
      effect: "He personifies the dagger as if the weapon made an error. The word “mis-sheathèd” says the dagger has been put in the wrong place. Capulet cannot yet know what happened, and his guess is partly right: the feud has put violence in the wrong place. The Capulets are still thinking of the dagger as Montague’s.",
      ask: "Why might Capulet blame a dagger and not a person?", tags: ["conflict", "family", "irony"], revise: true, support: "Capulet personifies the dagger to show that…" },
    { id: "h3", at: 219, phrase: "Grief of my son’s exile hath stopped her breath", title: "The cost to Montague", meaning: "Lady Montague has died of grief at Romeo’s banishment.",
      effect: "The deaths are not only the lovers’. The feud has taken Mercutio, Tybalt, Paris, Lady Montague, Romeo and Juliet. Montague says it in the plainest language, which makes his loss feel quiet and real.",
      ask: "What does Lady Montague’s death add to the play’s final tally of loss?", tags: ["family", "conflict"], revise: true, support: "Lady Montague’s death shows that…" },
    { id: "h4", at: 224, phrase: "Seal up the mouth of outrage", title: "The Prince restores order", meaning: "The Prince tells everyone to stop shouting until the facts are known.",
      effect: "“Seal up the mouth” is a metaphor in which outrage is a mouth to be closed. It shows the Prince acting as a judge, and also continues the play’s imagery of mouths, tombs and jaws. His calm language is a contrast with the earlier public brawls.",
      ask: "How does the Prince’s tone differ from the quarrelling earlier in the play?", tags: ["conflict", "language"], revise: true, support: "The Prince’s language is controlled because…" },
    { id: "h5", at: 231, phrase: "I am the greatest, able to do least", title: "The Friar’s paradox", meaning: "The Friar says he is the most involved person but the least able to act.",
      effect: "The paradox sums up his position: he planned everything, yet he has no power to change what happened. He then offers himself as both accuser and defender. Readers disagree on how much blame he deserves, so use evidence from his speech and the earlier acts.",
      ask: "How much responsibility does the Friar accept in this speech, and how can you tell?", tags: ["family", "language"], revise: true, support: "The paradox “greatest… least” suggests that the Friar…", stretch: "Does the Friar’s account leave anything out? Compare it with what you know from earlier scenes." },
    { id: "h6", at: 241, phrase: "stol’n marriage", title: "A marriage kept secret", meaning: "“Stol’n” means secret. The Friar says he married them in secret.",
      effect: "Secrecy runs through the whole plot. Because the marriage was hidden, Juliet could not simply refuse Paris, and no one but the Friar and the Nurse could help. Much of what goes wrong is the result of what could not be said openly.",
      ask: "How does secrecy make the tragedy more likely?", tags: ["appearance", "family"] },
    { id: "h7", at: 259, phrase: "stayed by accident", title: "Accident or consequence?", meaning: "The Friar says the letter was held up by accident.",
      effect: "He calls the failure an accident, as he did earlier with “unhappy fortune”. An accident supports the view that fate is to blame. The plan depended on one messenger and perfect timing, which supports the view that human choices made disaster likely. The text supports both.",
      ask: "Is “accident” a complete explanation? Give one argument for and one against.", tags: ["fate", "family"], revise: true, support: "The Friar’s word “accident” suggests…", stretch: "Which earlier decisions made one delay so dangerous?" },
    { id: "h8", from: 275, to: 277, title: "The Friar offers his life", meaning: "The Friar says that if any of this went wrong by his fault, his old life should be given up to the law.",
      effect: "He accepts a possible punishment, while the “if” leaves it open whether he feels guilty. The Prince answers, “We still have known thee for a holy man”, and does not punish him. Readers can judge this as mercy or as the Prince avoiding a harder question.",
      ask: "Is the Prince right to let the Friar go? Give one reason on each side.", tags: ["family", "conflict"], support: "The Prince’s response suggests that…" }
  ] },
{ type: "extract", key: "e9", short: "5.3 Ending", mins: 12, label: "Extract 9", scene: "5.3",
  title: "“A glooming peace this morning with it brings”", sub: "Act 5, Scene 3, lines 300–320",

  lines: [
    { k: "sp", t: "PRINCE" },
    { k: "ln", n: 300, t: "Where be these enemies?—Capulet, Montague,", g: "Where are these enemies? Capulet, Montague," },

    { k: "ln", n: 302, t: "That heaven finds means to kill your joys with love,", g: "that heaven finds ways to kill your happiness with love," },

    { k: "ln", n: 316, t: "The sun for sorrow will not show his head.", g: "The sun is too sad to show its face." },

  notes: [
    { id: "i1", at: 301, phrase: "a scourge is laid upon your hate", title: "The scourge on the feud", meaning: "A scourge is a whip or punishment. The Prince says the deaths are a punishment for the families’ hatred.",
      effect: "He makes a moral judgement: the cost of the feud has been paid by the children. Some readers hear the voice of fate or heaven, and others hear a human leader explaining events. The verb “laid upon” suggests that the punishment was applied by something above them.",
      ask: "Who or what does the Prince say is punishing the families?", tags: ["conflict", "family", "fate"], revise: true, support: "The word “scourge” suggests that the Prince believes…", stretch: "Compare “a scourge” with the Prologue’s “their parents’ strife”." },
    { id: "i2", at: 302, phrase: "kill your joys with love", title: "A paradox about love", meaning: "The Prince says heaven found a way to kill the families’ joys using love.",
      effect: "It is a paradox: love, normally a good thing, becomes the tool of destruction. The children they most loved died because of a love that the feud forbade. The line ties the play’s two main ideas together, love and hate.",
      ask: "How does the Prince turn “love” into a punishment?", tags: ["language", "love", "irony"], revise: true, support: "The paradox shows that love…" },
    { id: "i3", from: 303, to: 304, title: "The Prince accepts blame", meaning: "The Prince says he too was at fault for “winking at” (ignoring) their quarrels, and has lost relatives, Mercutio and Paris.",
      effect: "Authority takes some responsibility. The Prince had warned the families, in Act 1, of death if they fought again, but he did not enforce it strongly. His words “All are punished” include himself.",
      ask: "How does the Prince’s admission affect the question of blame?", tags: ["family", "conflict"] },
    { id: "i4", at: 305, phrase: "give me thy hand", title: "The handshake", meaning: "Capulet offers Montague his hand, calling him “brother”.",
      effect: "For the first time, one father offers a gesture of peace. The word “brother” replaces “Montague”, who had been an enemy. In Act 1 the fathers called for swords against each other. The handshake is the reconciliation that the Friar hoped the marriage would bring.",
      ask: "Why does Capulet say “brother” instead of “Montague”?", tags: ["family", "conflict", "love"], revise: true, support: "Capulet’s word “brother” shows that…" },
    { id: "i5", at: 309, phrase: "ray her statue in pure gold", title: "Statues of gold", meaning: "Montague promises a statue of Juliet made of pure gold, and Capulet promises one for Romeo.",
      effect: "The fathers honour the children with something valuable. Earlier Romeo said gold is “worse poison to men’s souls”, so the golden statues can be read as a real tribute or as a hollow one, since peace has been bought with their deaths. The text supports both readings.",

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (s) => esc(s).replace(/\[([^\]]+)\]/g, '<i class="sd">[$1]</i>').replace(/\n/g, "<br>");
const SHORT = { fate: "Fate", conflict: "Conflict", family: "Family", love: "Love", language: "Language", appearance: "Appearance", irony: "Irony", context: "Context", ahead: "Look ahead" };
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ratings are the only thing kept on the device, and only if the browser allows it */
const RKEY = "rj-act5-ratings";
function loadRate() { try { return JSON.parse(localStorage.getItem(RKEY) || "{}"); } catch (e) { return {}; } }
function saveRate() { try { localStorage.setItem(RKEY, JSON.stringify(S.rate)); } catch (e) { /* storage unavailable */ } }

const S = { view: "lesson", h: 0, s: 0, tag: "all", sel: null, scale: 1, drawer: null, wide: false, mainHidden: false, focus: false, gloss: true,
  rev: { tab: "quotes", tag: "all", quiz: null }, rate: loadRate() };
const cur = () => DATA.hours[S.h].steps[S.s];
let DR = {};

/* order notes by position in the text */
DATA.hours.forEach((h) => h.steps.forEach((st) => {
  if (st.type !== "extract") return;
  const posOf = (n) => {
    let i;
    if (n.stage) i = st.lines.findIndex((l) => l.k === "st" && l.key === n.stage);
    else { const ln = n.at !== undefined ? n.at : n.from; i = st.lines.findIndex((l) => l.k === "ln" && l.n === ln); }
    return i * 1000 + (n.phrase && !n.stage && i >= 0 ? Math.max(0, (st.lines[i].t || "").indexOf(n.phrase)) : 0);
  };
  st.notes.forEach((n) => (n._pos = posOf(n)));
  st.notes.sort((a, b) => a._pos - b._pos);
}));

const tagOK = (n, tag) => tag === "all" || n.tags.includes(tag);
const match = (n) => tagOK(n, S.tag);
const visible = (st) => st.notes.filter(match);
const byId = (st, id) => st.notes.find((n) => n.id === id);

/* ---------- top bar ---------- */

    `<button class="lm rev${S.view === "revise" ? " on" : ""}" data-view="revise"><b>Revise</b><small>Practise at home</small></button>`;
}
function renderNav() {

    nav.innerHTML = `<div class="tabs2" role="tablist">${tabs.map(([k, l]) => `<button class="tab${S.rev.tab === k ? " on" : ""}" data-tab="${k}">${l}</button>`).join("")}</div>`;

/* ---------- bottom bar: theme filters ---------- */
function chipRow(notes, active) {
  const counts = {};
  notes.forEach((n) => n.tags.forEach((t) => (counts[t] = (counts[t] || 0) + 1)));
  return `<span class="fl">Show notes about</span><button class="chip${active === "all" ? " on" : ""}" data-tag="all">All (${notes.length})</button>` +
    Object.keys(DATA.TAGS).filter((t) => counts[t]).map((t) =>
      `<button class="chip tg-${t}${active === t ? " on" : ""}" data-tag="${t}"><i class="dot"></i>${esc(SHORT[t])} (${counts[t]})</button>`).join("");
}
function renderFilters() {
  const el = $("#filters");
  if (S.view === "revise") {
    if (S.rev.tab !== "quotes") { el.hidden = true; return; }
    el.hidden = false; el.innerHTML = chipRow(reviseNotes().map((x) => x.n), S.rev.tag); return;
  }
  const st = cur();
  if (st.type !== "extract") { el.hidden = true; return; }
  el.hidden = false;
  const has = new Set(); st.notes.forEach((n) => n.tags.forEach((t) => has.add(t)));
  if (S.tag !== "all" && !has.has(S.tag)) S.tag = "all";
  el.innerHTML = chipRow(st.notes, S.tag);
}

function qaCards(qa) {

}
function ratingHTML(h) {
  const A = DATA.hours[h].aims;

  return items.map((t, i) => {
    const v = S.rate[h + ":" + i];

      ["Not yet", "Nearly", "Got it"].map((l, k) => `<button class="rb${v === k ? " on" : ""}" data-rate="${h}:${i}:${k}">${l}</button>`).join("") + `</div></div>`;
  }).join("");
}
function clozeParts(text) {
  let i = 0;
  const html = esc(text).replace(/\{\{(.+?)\}\}/g, (m, a) => { i++; return `<span class="gap" data-gap role="button" tabindex="0"><sup>${i}</sup><span class="ans">${esc(a)}</span></span>`; });
  const bank = [...text.matchAll(/\{\{(.+?)\}\}/g)].map((m) => m[1]).sort((a, b) => a.localeCompare(b));
  return { html, bank };
}
const ideas = (items) => items.map((i) => `<div class="idea"><b>${esc(i.h)}</b><p>${esc(i.t)}</p></div>`).join("");

/* ---------- the extract ---------- */
function annSpans(text, notes) {
  const marks = [];
  notes.forEach((n) => { const i = text.indexOf(n.phrase); if (i >= 0) marks.push({ s: i, e: i + n.phrase.length, n }); });
  marks.sort((a, b) => a.s - b.s);
  let out = "", p = 0;
  marks.forEach((m) => {
    out += fmt(text.slice(p, m.s));
    out += `<span class="ann${match(m.n) ? "" : " dim"}" data-note="${m.n.id}" role="button" tabindex="0">${fmt(text.slice(m.s, m.e))}</span>`;
    p = m.e;
  });
  return out + fmt(text.slice(p));
}
function quoteOf(st, n) {
  if (n.phrase) return n.phrase;
  const ls = st.lines.filter((l) => l.k === "ln" && l.n >= n.from && l.n <= n.to).map((l) => l.t);
  return ls.length > 2 ? ls[0] + " … " + ls[ls.length - 1] : ls.join(" / ");
}
function notePanel(st, n) {
  const vis = visible(st), idx = vis.findIndex((x) => x.id === n.id);

      (n.support ? `<div class="tier sup" hidden><b>Sentence starter</b>${esc(n.support)}</div>` : "") +
      (n.stretch ? `<div class="tier str" hidden><b>Stretch question</b>${esc(n.stretch)}</div>` : "")
    : "";
  return `<div class="ptop"><span>Note ${idx + 1} of ${vis.length}</span></div>` +
    `<p class="q">${fmt(quoteOf(st, n))}</p><h3>${esc(n.title)}</h3>` +
    `<div class="lab">In plain English</div><p>${esc(n.meaning)}</p>` +
    `<div class="lab">Why it matters</div><p>${esc(n.effect)}</p>` +
    (n.ask ? `<div class="ask"><b>Ask the class</b><p>${esc(n.ask)}</p></div>` : "") + tiers +
    `<div class="tagrow">${n.tags.map((t) => `<span class="chip tg-${t}"><i class="dot"></i>${esc(DATA.TAGS[t])}</span>`).join("")}</div>` +
    `<div class="notenav"><button data-act="pn">◀ Previous note</button><button data-act="nn">Next note ▶</button></div>`;
}
function scenePanel(st) {

      else for (let i = n.from; i <= n.to; i++) rng[i] = n;
    });
    const glossHTML = (l) => S.gloss && l.g ? `<div class="gl"><span class="glab">Plain English</span>${esc(l.g)}</div>` : "";

  },
  plenary(st) {
    return {

      body: `<div class="inner">${qaCards(st.ticket)}</div>`,
      drawers: [
        { id: "rate", label: "Rate yourself", cta: true, title: "Rate yourself", html: () => `<p class="hint">How well can you do each of today’s success criteria?</p><div id="ratings">${ratingHTML(S.h)}</div>` },
        { id: "next", label: "What’s next", title: "What’s next", html: () => `<div class="track"><p>${esc(st.next)}</p></div>` },
      ],
    };
  },
  practice(st) {
    const cards = st.qs.map((q) => {
      const starter = q.starter ? `<p class="hint" style="margin:.4rem 0 0;font-weight:400"><b>Starter:</b> ${esc(q.starter)}</p>` : "";
      return `<div class="qa" role="button" tabindex="0" data-qa><span class="lv">Write your answer · ${q.marks} mark${q.marks > 1 ? "s" : ""}</span><div class="qq">${esc(q.q)}</div>${starter}<div class="aa">${esc(q.a)}</div></div>`;
    }).join("");
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: st.sub, rail: "Questions",
      actions: `<button class="tb" data-act="timer" data-sec="${st.timer || 300}">${Math.round((st.timer || 300) / 60)}-minute timer</button>`,
      body: `<div class="inner">${cards}</div>`,
      drawers: [{ id: "tips", label: st.tipsTitle, title: st.tipsTitle, html: () => ideas(st.tips) }],
    };
  },
};

/* ---------- putting a step on screen ---------- */
function mainMarkup(v) {
  const btns = v.drawers.map((d) => `<button class="tb${d.cta ? " cta" : ""}" data-drawer="${d.id}" aria-pressed="false">${esc(typeof d.label === "function" ? d.label() : d.label)}</button>`).join("");
  const focus = v.focus ? `<button class="tb" data-act="focus" title="Show only the extract (F)"><i class="ic ic-focus"></i>Focus</button>` : "";
  return `<section class="pane main" id="mainpane"><div class="phead"><div class="pt"><span class="kick">${esc(v.kick)}</span><h2>${esc(v.title)}</h2>${v.sub ? `<p class="sub">${esc(v.sub)}</p>` : ""}</div>` +
    `<div class="ptools">${btns}${v.actions || ""}${focus}</div></div><div class="pbody" id="script">${v.body}</div></section>`;
}
const drawerMarkup = () =>
  `<aside class="pane drawer" id="drawer" hidden aria-label="Side panel"><div class="dhead"><h3 id="dtitle"></h3><div class="dtools">` +
  `<button class="tb" data-act="dwide" title="Make this panel wider or narrower"><i class="ic ic-wide"></i><span id="lw">Wider</span></button>` +
  `<button class="tb" data-act="dfull" title="Hide the main pane to use the full width"><i class="ic ic-full"></i><span id="lf">Hide</span></button>` +
  `<button class="ib" data-act="dclose" aria-label="Close" title="Close (Esc)"><i class="ic ic-close"></i></button></div></div><div class="dbody" id="panel" aria-live="polite"></div></aside>` +
  `<button class="railtab" id="mainrail" data-act="showmain" hidden></button>`;

function mount(keep) {
  const el = $("#stage");
  if (S.view === "revise") { el.innerHTML = reviseHTML(); S.drawer = null; layout(); el.firstElementChild.scrollTop = 0; return; }
  const st = cur();
  const v = VIEW[st.type](st);
  DR = {}; v.drawers.forEach((d) => (DR[d.id] = d));
  const keepTop = keep && $("#script") ? $("#script").scrollTop : 0;
  if (!keep) { S.drawer = null; S.wide = false; S.mainHidden = false; S.sel = null; }
  el.innerHTML = mainMarkup(v) + drawerMarkup();
  S.rail = (v.rail || "main pane").toLowerCase();
  const rail = $("#mainrail"); if (rail) rail.textContent = "Show " + S.rail;
  if (S.drawer && S.drawer !== "note" && !DR[S.drawer]) S.drawer = null;
  if (S.drawer === "note" && !S.sel) S.drawer = null;
  layout();
  if (S.sel) markSel();
  const sc = $("#script"); if (sc) sc.scrollTop = keepTop;
}
function markSel() { document.querySelectorAll("[data-note]").forEach((el) => el.classList.toggle("on", el.dataset.note === S.sel)); }
function layout() {
  const c = $("#stage"), d = $("#drawer");
  const has = !!S.drawer && !!d;
  c.classList.toggle("has-drawer", has);
  c.classList.toggle("wide", has && S.wide);
  c.classList.toggle("mainhidden", has && S.mainHidden);
  if (d) d.hidden = !has;
  const rail = $("#mainrail"); if (rail) rail.hidden = !(has && S.mainHidden);
  document.querySelectorAll(".tb[data-drawer]").forEach((b) => { const on = b.dataset.drawer === S.drawer; b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); });
  if (has) { fillDrawer(); $("#lw").textContent = S.wide ? "Narrower" : "Wider"; $("#lf").textContent = (S.mainHidden ? "Show " : "Hide ") + S.rail; }
}
function fillDrawer() {
  const st = cur();
  let title, html;
  if (S.drawer === "note") {
    const n = S.sel && byId(st, S.sel);
    if (!n) { closeDrawer(); return; }
    title = "Notes"; html = notePanel(st, n);
  } else { const dd = DR[S.drawer]; title = dd.title || (typeof dd.label === "string" ? dd.label : ""); html = dd.html(); }
  $("#dtitle").textContent = title;
  $("#panel").innerHTML = html;
  $("#panel").scrollTop = 0;
}
function openDrawer(id) { S.drawer = id; layout(); }
function closeDrawer() {
  if (S.drawer === "note") S.sel = null;
  S.drawer = null; S.wide = false; S.mainHidden = false; markSel(); layout();
}
function select(id) {
  S.sel = id; S.drawer = "note"; markSel(); layout();
  const first = document.querySelector(`[data-note="${id}"]`);
  if (first) setTimeout(() => first.scrollIntoView({ block: "center", behavior: reduced() ? "auto" : "smooth" }), 40);
}
function stepNote(d) {
  const st = cur(), vis = visible(st);
  if (!vis.length) return;
  let i = vis.findIndex((n) => n.id === S.sel);
  i = i < 0 ? (d > 0 ? 0 : vis.length - 1) : (i + d + vis.length) % vis.length;
  select(vis[i].id);
}
function setFocus(on) {
  if (on && (S.view !== "lesson" || cur().type !== "extract")) return;
  S.focus = on;
  document.body.classList.toggle("focus", on);
  $("#fctl").setAttribute("aria-hidden", String(!on));
  if (on) setTimeout(() => $("#unfocus").focus({ preventScroll: true }), 400);
}

/* ---------- revise mode (for home) ---------- */
function reviseNotes() {
  const out = [];
  DATA.hours.forEach((h) => h.steps.filter((s) => s.type === "extract").forEach((st) => st.notes.filter((n) => n.revise).forEach((n) => out.push({ st, n }))));
  return out;
}
function refText(st, n) {
  const ln = n.at !== undefined ? `line ${n.at}` : n.from !== undefined ? (n.from === n.to ? `line ${n.from}` : `lines ${n.from}–${n.to}`) : "";
  return `Act ${st.scene.split(".")[0]} Scene ${st.scene.split(".")[1]}${ln ? ", " + ln : ""}`;
}
function reviseHTML() {
  const head = `<div class="head"><h2>Revise Act 5</h2><p class="intro">Try to answer before you reveal. Nothing here is marked, so mistakes are useful.</p></div>`;
  let body = "";
  if (S.rev.tab === "quotes") {
    const cards = reviseNotes().filter(({ n }) => tagOK(n, S.rev.tag));
    body = `<p class="intro">Read the quotation. Say what it shows about the character or the theme. Then tap to check.</p>` +
      `<div class="qgrid">${cards.map(({ st, n }) => `<div class="qcard" role="button" tabindex="0" data-qcard><p class="qt">${fmt(quoteOf(st, n))}</p><p class="qr">${esc(refText(st, n))}</p>` +
        `<div class="qb"><p><b>${esc(n.title)}.</b> ${esc(n.meaning)}</p><p>${esc(n.effect)}</p>${n.support ? `<p><b>Sentence starter:</b> ${esc(n.support)}</p>` : ""}${n.stretch ? `<p><b>Stretch:</b> ${esc(n.stretch)}</p>` : ""}` +
        `<div class="tagrow">${n.tags.map((t) => `<span class="chip tg-${t}"><i class="dot"></i>${esc(DATA.TAGS[t])}</span>`).join("")}</div></div></div>`).join("")}</div>`;
  } else if (S.rev.tab === "quiz") {
    body = quizHTML();
  } else if (S.rev.tab === "gaps") {
    DATA.hours.forEach((h) => { let last = null; h.steps.forEach((st) => {
      if (st.type === "extract") last = st;
      if (st.type === "link") {
        const { html, bank } = clozeParts(st.text);
        body += `<div class="gapcard"><h3>${esc(h.title)}: after ${esc(last ? last.title : "the start")}</h3><p class="cloze">${html}</p><div class="bank">${bank.map((a) => `<span>${esc(a)}</span>`).join("")}</div>` +
          (st.ext ? `<p class="stretchsc"><b>Stretch:</b> ${esc(st.ext)}</p>` : "") + `<div class="row"><button class="ghost small" data-act="revealcard">Reveal all</button></div></div>`;
      }
    }); });
    body = `<p class="intro">Fill the gaps in your head or on paper. Then tap a gap to check it.</p>` + body;
  } else {
    body = `<p class="intro">Rate yourself against each success criterion. Your choices stay on this device only.</p>` +
      DATA.hours.map((h, i) => `<div class="gapcard"><h3>${esc(h.title)}</h3><p>${esc(h.aims.li)}</p><div id="ratings-${i}" class="ratings-h">${ratingHTML(i)}</div></div>`).join("");
  }
  return `<section class="pane wide revise" id="script">${head}${body}</section>`;
}
function quizHTML() {
  const Q = DATA.QUIZ;
  const z = S.rev.quiz;
  if (!z) return `<div class="qz"><h3>Quick quiz</h3><p class="intro">${Q.length} questions on Act 5, Scenes 1 to 3. Pick an answer to see why.</p><button class="ghost primary" data-act="qstart">Start the quiz</button></div>`;
  if (z.done) return `<div class="qz"><h3>Finished</h3><p class="score">${z.score} out of ${Q.length}</p><p class="intro">${z.score === Q.length ? "Every question right. Try the stretch questions in Key quotes." : "Go back to Key quotes or Gap-fills for anything that surprised you, then try again."}</p><button class="ghost primary" data-act="qstart">Try again</button></div>`;
  const q = Q[z.order[z.i]];
  return `<div class="qz"><span class="qn">Question ${z.i + 1} of ${Q.length}</span><h3>${esc(q.q)}</h3>` +
    q.opts.map((o, i) => `<button class="opt${z.picked !== null ? (i === q.correct ? " right" : i === z.picked ? " wrong" : "") : ""}" data-qopt="${i}" ${z.picked !== null ? "disabled" : ""}>${"ABCD"[i]}&nbsp; ${esc(o)}</button>`).join("") +
    (z.picked !== null ? `<p class="why"><b>${z.picked === q.correct ? "Correct." : "Not quite."}</b> ${esc(q.why)}</p><button class="ghost primary" data-act="qnext">${z.i + 1 === Q.length ? "See my score" : "Next question"}</button>` : "") + `</div>`;
}
function qstart() {
  const order = DATA.QUIZ.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  S.rev.quiz = { order, i: 0, score: 0, picked: null, done: false };
}

/* ---------- navigation ---------- */
function renderAll() { renderTop(); renderNav(); renderFilters(); mount(false); }
function go(h, s) {
  if (S.focus) setFocus(false);
  S.view = "lesson"; S.h = h; S.s = s; S.sel = null;
  renderAll();
}
function move(d) {
  let h = S.h, s = S.s + d;
  if (s < 0) { if (h === 0) return; h--; s = DATA.hours[h].steps.length - 1; }
  else if (s >= DATA.hours[h].steps.length) { if (h === DATA.hours.length - 1) return; h++; s = 0; }
  go(h, s);
}
function showRevise() { if (S.focus) setFocus(false); S.view = "revise"; renderTop(); renderNav(); renderFilters(); mount(false); }

/* ---------- timer ---------- */
const T = { id: null, end: 0 };
const mmss = (s) => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
function timerStart(sec) {
  clearInterval(T.id);
  const el = $("#timer"); el.hidden = false; el.classList.remove("done");
  T.end = Date.now() + sec * 1000;
  const tick = () => {
    const left = Math.max(0, Math.ceil((T.end - Date.now()) / 1000));
    $("#tt").textContent = left > 0 ? mmss(left) : "Time!";
    if (left <= 0) { clearInterval(T.id); el.classList.add("done"); }
  };
  tick(); T.id = setInterval(tick, 250);
}
function timerStop() { clearInterval(T.id); $("#timer").hidden = true; }

/* ---------- events ---------- */
function syncReveal(scope) {
  const btn = (scope || document).querySelector('[data-act="reveal"],[data-act="revealcard"]');
  if (!btn) return;
  const gaps = [...(scope || document).querySelectorAll(".gap")];
  btn.textContent = gaps.length && gaps.every((g) => g.classList.contains("open")) ? "Hide all" : "Reveal all";
}
function hidePops() {
  document.querySelectorAll(".pop").forEach((p) => { p.hidden = true; const b = p.parentElement.querySelector("button[aria-haspopup]"); if (b) b.setAttribute("aria-expanded", "false"); });
}
document.addEventListener("click", (e) => {
  const t = e.target;
  const pb = t.closest("button[aria-haspopup]");
  if (pb) {
    const p = pb.parentElement.querySelector(".pop"), wasHidden = p.hidden;
    hidePops(); p.hidden = !wasHidden; pb.setAttribute("aria-expanded", String(wasHidden));
    return;
  }
  if (!t.closest(".pop")) hidePops();
  const dr = t.closest("[data-drawer]");
  if (dr) {
    const id = dr.dataset.drawer;
    if (S.drawer === id) closeDrawer();
    else if (id === "note") { if (S.sel && visible(cur()).some((n) => n.id === S.sel)) select(S.sel); else stepNote(1); }
    else { if (S.drawer === "note") S.sel = null; markSel(); openDrawer(id); }
    return;
  }
  const note = t.closest("[data-note]");
  if (note) { select(note.dataset.note); return; }
  const gap = t.closest("[data-gap]");
  if (gap) { gap.classList.toggle("open"); syncReveal(gap.closest(".gapcard") || document); return; }
  const qa = t.closest("[data-qa]");
  if (qa) { qa.classList.toggle("open"); return; }
  const fact = t.closest("[data-reveal]");
  if (fact) { fact.classList.toggle("open"); return; }
  const qc = t.closest("[data-qcard]");
  if (qc) { qc.classList.toggle("open"); return; }
  const rate = t.closest("[data-rate]");
  if (rate) {
    const [h, i, v] = rate.dataset.rate.split(":");
    S.rate[h + ":" + i] = +v; saveRate();
    const box = rate.closest("#ratings, .ratings-h");
    if (box) box.innerHTML = ratingHTML(+h);
    return;
  }
  const qo = t.closest("[data-qopt]");
  if (qo) {
    const z = S.rev.quiz, q = DATA.QUIZ[z.order[z.i]];
    if (z.picked === null) { z.picked = +qo.dataset.qopt; if (z.picked === q.correct) z.score++; $("#stage").innerHTML = reviseHTML(); }
    return;
  }
  const b = t.closest("button");
  if (!b) return;
  if (b.closest("#tmenu")) { timerStart(+b.dataset.sec); hidePops(); return; }
  if (b.dataset.view === "revise") { hidePops(); showRevise(); return; }
  if (b.dataset.h !== undefined) { hidePops(); return go(+b.dataset.h, 0); }
  if (b.dataset.s !== undefined) return go(S.h, +b.dataset.s);
  if (b.dataset.tab) { S.rev.tab = b.dataset.tab; renderNav(); renderFilters(); $("#stage").innerHTML = reviseHTML(); return; }
  if (b.dataset.tag !== undefined) {
    if (S.view === "revise") { S.rev.tag = b.dataset.tag; renderFilters(); $("#stage").innerHTML = reviseHTML(); return; }
    S.tag = b.dataset.tag;
    const st = cur();
    if (S.sel && !match(byId(st, S.sel))) { S.sel = null; if (S.drawer === "note") S.drawer = null; }
    renderFilters(); mount(true);
    return;
  }
  switch (b.dataset.act) {
    case "next": move(1); break;
    case "prev": move(-1); break;
    case "nn": stepNote(1); break;
    case "pn": stepNote(-1); break;
    case "firstnote": stepNote(1); break;
    case "dclose": closeDrawer(); break;
    case "dwide": S.wide = !S.wide; S.mainHidden = false; layout(); break;
    case "dfull": S.mainHidden = !S.mainHidden; layout(); break;
    case "showmain": S.mainHidden = false; layout(); break;
    case "focus": setFocus(true); break;
    case "glosstoggle": S.gloss = !S.gloss; mount(true); break;
    case "unfocus": setFocus(false); break;
    case "tog": { const el = $("#panel ." + b.dataset.t); if (el) { el.hidden = !el.hidden; if (!el.hidden) el.scrollIntoView({ block: "nearest" }); } break; }
    case "timer": timerStart(+b.dataset.sec); break;
    case "tstop": timerStop(); break;
    case "qstart": qstart(); $("#stage").innerHTML = reviseHTML(); break;
    case "qnext": { const z = S.rev.quiz; z.i++; z.picked = null; if (z.i >= DATA.QUIZ.length) z.done = true; $("#stage").innerHTML = reviseHTML(); break; }
    case "reveal": case "revealcard": {
      const scope = b.closest(".gapcard") || document;
      const gaps = scope.querySelectorAll(".gap");
      const allOpen = [...gaps].every((g) => g.classList.contains("open"));
      gaps.forEach((g) => g.classList.toggle("open", !allOpen));
      syncReveal(scope);
      break;
    }
  }
});
document.addEventListener("keydown", (e) => {
  const tg = e.target instanceof Element ? e.target : document.body;
  if ((e.key === "Enter" || e.key === " ") && tg.matches("[role=button]")) { e.preventDefault(); tg.click(); return; }
  if (tg.matches("input,textarea") || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "Escape") {
    if ([...document.querySelectorAll(".pop")].some((p) => !p.hidden)) hidePops();
    else if (S.focus) setFocus(false);
    else if (S.drawer) closeDrawer();
    return;
  }
  if (S.view !== "lesson") return;
  if (e.key === "f" || e.key === "F") { setFocus(!S.focus); return; }
  if (S.focus) return;
  if (e.key === "ArrowRight") move(1);
  else if (e.key === "ArrowLeft") move(-1);
  else if (e.key === "]") stepNote(1);
  else if (e.key === "[") stepNote(-1);
});

/* tools */
function setScale(d) {
  S.scale = Math.min(1.6, Math.max(0.75, +(S.scale + d).toFixed(2)));
  document.documentElement.style.setProperty("--scale", S.scale);
}
["#fsm", "#ffm"].forEach((id) => $(id).addEventListener("click", () => setScale(-0.1)));
["#fsp", "#ffp"].forEach((id) => $(id).addEventListener("click", () => setScale(0.1)));
function effectiveTheme() { return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
function syncTheme() { $("#theme").textContent = effectiveTheme() === "dark" ? "Day mode" : "Night mode"; }
$("#theme").addEventListener("click", () => { document.documentElement.dataset.theme = effectiveTheme() === "dark" ? "light" : "dark"; syncTheme(); });
$("#full").addEventListener("click", () => {
  try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (err) { /* not available */ }
});
syncTheme();
renderAll();

</script>

</body></html>
